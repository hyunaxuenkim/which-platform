name: which_platform
description: "Seoul subway route guide app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  cupertino_icons: ^1.0.8
  drift: ^2.28.1
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  path: ^1.9.1
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.28.1
  freezed: ^3.2.3
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/branch_keys.csv
    - assets/data/direction_policies.csv
    - assets/data/full_route_info.csv
    - assets/data/station_transition_overrides.csv
    - assets/data/subway_line_info.json
