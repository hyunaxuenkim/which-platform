name: CI

on:
  pull_request:
    branches:
      - main
      - 'topic/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'topic/**'
      - 'milestone/**'

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test
