name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'topic/**'
      - 'milestone/**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
